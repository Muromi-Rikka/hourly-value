<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">全球最低工资对比</title>
  <desc id="hero-desc">以人民币购买力为基准，对比 13 个国家/地区最低时薪的横向条形图，按洲着色。</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="1199" height="399" rx="26" fill="#FCF9F7" stroke="#E5E5EA"/>

  <!-- ── title block ── -->
  <g id="title-block" class="sans">
    <text x="56" y="64" class="mono" font-size="18" fill="#72727C" letter-spacing="2">HOURLY-VALUE · 13 COUNTRIES · 5 INDICES</text>
    <text x="56" y="134" font-size="58" font-weight="700" fill="#090910">全球最低工资对比</text>
    <rect x="56" y="160" width="72" height="4" rx="2" fill="#C54E2B"/>
    <text x="56" y="206" font-size="21" fill="#72727C">以人民币购买力为统一基准，折算各国最低时薪，</text>
    <text x="56" y="238" font-size="21" fill="#72727C">再用 iPhone、巨无霸、物资、Model Y 指数交叉验证。</text>
    <text x="56" y="304" class="mono" font-size="18" fill="#72727C">React · Rsbuild · Recharts · TanStack · MIT</text>
    <text x="56" y="332" class="mono" font-size="18" fill="#72727C">数据截至 2026 · 各国官方来源</text>
  </g>

  <!-- ── proof: wage bar chart ── -->
  <g id="wage-chart" class="sans">
    <!-- header -->
    <text x="660" y="60" font-size="18" font-weight="600" fill="#090910">最低时薪 · 人民币折算</text>
    <text x="1144" y="60" class="mono" font-size="18" fill="#C54E2B" text-anchor="end">最高 ≈ 最低 × 5.1</text>

    <!-- axis -->
    <line x1="760" y1="76" x2="760" y2="344" stroke="#E5E5EA" stroke-width="1"/>

    <!-- rows: 卢森堡117 荷兰116 澳大利亚114 英国104 德国101 新西兰100 法国92 加拿大84 美国79 西班牙56 韩国47 日本47 中国23 -->
    <g id="rows" font-size="18">
      <!-- 卢森堡 -->
      <text x="748" y="96" text-anchor="end" fill="#090910">卢森堡</text>
      <rect x="760" y="83" width="314" height="12" rx="6" fill="#567CD3"/>
      <text x="1082" y="96" class="mono" fill="#72727C">117</text>
      <!-- 荷兰 -->
      <text x="748" y="117" text-anchor="end" fill="#090910">荷兰</text>
      <rect x="760" y="104" width="311" height="12" rx="6" fill="#567CD3"/>
      <text x="1079" y="117" class="mono" fill="#72727C">116</text>
      <!-- 澳大利亚 -->
      <text x="748" y="138" text-anchor="end" fill="#090910">澳大利亚</text>
      <rect x="760" y="125" width="306" height="12" rx="6" fill="#00A159"/>
      <text x="1074" y="138" class="mono" fill="#72727C">114</text>
      <!-- 英国 -->
      <text x="748" y="159" text-anchor="end" fill="#090910">英国</text>
      <rect x="760" y="146" width="279" height="12" rx="6" fill="#567CD3"/>
      <text x="1047" y="159" class="mono" fill="#72727C">104</text>
      <!-- 德国 -->
      <text x="748" y="180" text-anchor="end" fill="#090910">德国</text>
      <rect x="760" y="167" width="271" height="12" rx="6" fill="#567CD3"/>
      <text x="1039" y="180" class="mono" fill="#72727C">101</text>
      <!-- 新西兰 -->
      <text x="748" y="201" text-anchor="end" fill="#090910">新西兰</text>
      <rect x="760" y="188" width="268" height="12" rx="6" fill="#00A159"/>
      <text x="1036" y="201" class="mono" fill="#72727C">100</text>
      <!-- 法国 -->
      <text x="748" y="222" text-anchor="end" fill="#090910">法国</text>
      <rect x="760" y="209" width="247" height="12" rx="6" fill="#567CD3"/>
      <text x="1015" y="222" class="mono" fill="#72727C">92</text>
      <!-- 加拿大 -->
      <text x="748" y="243" text-anchor="end" fill="#090910">加拿大</text>
      <rect x="760" y="230" width="225" height="12" rx="6" fill="#CA5747"/>
      <text x="993" y="243" class="mono" fill="#72727C">84</text>
      <!-- 美国 -->
      <text x="748" y="264" text-anchor="end" fill="#090910">美国</text>
      <rect x="760" y="251" width="212" height="12" rx="6" fill="#CA5747"/>
      <text x="980" y="264" class="mono" fill="#72727C">79</text>
      <!-- 西班牙 -->
      <text x="748" y="285" text-anchor="end" fill="#090910">西班牙</text>
      <rect x="760" y="272" width="150" height="12" rx="6" fill="#567CD3"/>
      <text x="918" y="285" class="mono" fill="#72727C">56</text>
      <!-- 韩国 -->
      <text x="748" y="306" text-anchor="end" fill="#090910">韩国</text>
      <rect x="760" y="293" width="126" height="12" rx="6" fill="#D3721E"/>
      <text x="894" y="306" class="mono" fill="#72727C">47</text>
      <!-- 日本 -->
      <text x="748" y="327" text-anchor="end" fill="#090910">日本</text>
      <rect x="760" y="314" width="126" height="12" rx="6" fill="#D3721E"/>
      <text x="894" y="327" class="mono" fill="#72727C">47</text>
      <!-- 中国 -->
      <text x="748" y="348" text-anchor="end" font-weight="600" fill="#090910">中国</text>
      <rect x="760" y="335" width="61" height="12" rx="6" fill="#D3721E"/>
      <text x="829" y="348" class="mono" fill="#72727C">23</text>
    </g>

    <!-- unit -->
    <text x="760" y="376" class="mono" font-size="18" fill="#72727C">¥/小时</text>

    <!-- region legend -->
    <g font-size="18" fill="#72727C">
      <circle cx="854" cy="370" r="5" fill="#567CD3"/>
      <text x="866" y="376">欧洲</text>
      <circle cx="934" cy="370" r="5" fill="#00A159"/>
      <text x="946" y="376">大洋洲</text>
      <circle cx="1032" cy="370" r="5" fill="#CA5747"/>
      <text x="1044" y="376">北美</text>
      <circle cx="1104" cy="370" r="5" fill="#D3721E"/>
      <text x="1116" y="376">亚洲</text>
    </g>
  </g>
</svg>
